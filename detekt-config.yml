# our custom detekt config built upon the default config from detekt
complexity:
  LargeClass:
    excludes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
  LongMethod:
    excludes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
    ignoreAnnotated: [ 'Composable' ]
  LongParameterList:
    ignoreAnnotated: [ 'Composable' ]
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    ignorePrivate: true
    ignoreAnnotatedFunctions: ['Preview']

exceptions:
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    functionPattern: '([a-z][a-zA-Z0-9]*)|(`.*`)'
    ignoreAnnotated: ['Composable']
  FunctionParameterNaming:
    excludes: ['**/test/**', '**/androidTest/**']
  InvalidPackageDeclaration:
    active: false # enable this in the future
  TopLevelPropertyNaming:
    excludes: ['**/test/**', '**/androidTest/**']
    constantPattern: '[A-Z][A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  VariableNaming:
    excludes: ['**/test/**', '**/androidTest/**']

potential-bugs:
  ImplicitDefaultLocale:
    active: false

style:
  DestructuringDeclarationWithTooManyEntries:
    active: false
  ExplicitItLambdaParameter:
    active: false
  ForbiddenComment:
    active: false
  FunctionOnlyReturningConstant:
    ignoreAnnotated: ['dagger.Provides']
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  UseCheckOrError:
    active: false
  UnusedParameter:
    active: false # enable this in the future
  UnusedPrivateFunction:
    active: false # enable this in the future
  UnusedPrivateProperty:
    active: false # enable this in the future
  UseArrayLiteralsInAnnotations:
    active: false
  UseRequire:
    active: false

ktlint:
  ArgumentListWrapping:
    active: false
  BackingPropertyNaming:
    active: false
  BinaryExpressionWrapping:
    active: false
  BlankLineBetweenWhenConditions:
    active: false
  BlockCommentInitialStarAlignment:
    active: false
  ClassSignature:
    active: false
  CommentWrapping:
    active: false
  Filename:
    active: false
  FunctionExpressionBody:
    active: false
  FunctionLiteral:
    active: false
  FunctionSignature:
    active: false
  Kdoc:
    active: false
  MaximumLineLength:
    active: false
  MixedConditionOperators:
    active: false
  MultiLineIfElse:
    active: false
  NoEmptyFirstLineInMethodBlock:
    active: false
  ParameterListWrapping:
    active: false
  PropertyName:
    constantNamingStyle: 'pascal_case'
  PropertyWrapping:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  SpacingBetweenDeclarationsWithComments:
    active: false
  StatementWrapping:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  TypeParameterListSpacing:
    active: false
  ValueArgumentComment:
    active: false
  ValueParameterComment:
    active: false
  Wrapping:
    active: false
